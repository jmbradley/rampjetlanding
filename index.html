<style>
  :root {
    --bg: #09090B;
    --ink: #EDEAE3;
    --ink-soft: #B9B5AD;
    --muted: #8C8983;
    --faint: #6E6B66;
    --accent: #EF4A34;
    --rule: rgba(237, 234, 227, 0.1);
    --grid: rgba(237, 234, 227, 0.035);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 80px 80px;
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .page {
    position: relative;
    height: 100vh;
    height: 100svh;
    padding: clamp(24px, 4.4vh, 40px) clamp(24px, 4.4vw, 64px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .hero-mark {
    position: absolute;
    z-index: 0;
    right: clamp(24px, 4.4vw, 64px);
    top: 50%;
    width: min(37.5vw, 58vh, 540px);
    height: auto;
    transform: translateY(-50%);
    pointer-events: none;
    user-select: none;
  }
  header, main, footer { position: relative; z-index: 1; }

  header { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 28px; height: auto; display: block; }
  .brand span { font-size: 13px; font-weight: 500; letter-spacing: 0.42em; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  main { display: flex; flex-direction: column; gap: clamp(20px, 4vh, 36px); max-width: min(900px, 58vw); }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.28em; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .eyebrow .dot { display: none; width: 5px; height: 5px; }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(44px, min(8.3vw, 13.3vh), 120px);
    line-height: 0.92;
    letter-spacing: -0.02em;
  }
  h1 .soft { color: var(--ink-soft); }
  h1 .stop { color: var(--accent); }
  .lede { margin: 0; max-width: 520px; font-size: 15px; line-height: 1.7; color: var(--muted); }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding-top: 20px; border-top: 1px solid var(--rule);
    font-size: 11px; letter-spacing: 0.2em; color: var(--faint); text-transform: uppercase;
  }
  .m-only { display: none; }
  /* the "shh" figure: a small mark at the end of the footer row, sitting
     under the rule after "Built quietly". Sized to the row so it never
     rises above the line or crowds the headline. */
  footer .right { display: flex; align-items: center; gap: 14px; }
  .shh { height: 44px; width: auto; display: block; pointer-events: none; user-select: none; }

  /* Phones and narrow screens */
  @media (max-width: 760px) {
    body { background-size: 40px 40px; }
    .hero-mark {
      right: auto; left: 50%;
      top: clamp(84px, 12svh, 110px);
      width: min(66vw, 32svh, 300px);
      transform: translateX(-50%);
    }
    .brand { gap: 10px; }
    .brand img { width: 24px; }
    .brand span { font-size: 12px; letter-spacing: 0.38em; }
    .status, .d-only, .shh { display: none; }
    .m-only { display: inline; }
    main { max-width: none; gap: 24px; margin-top: auto; margin-bottom: 32px; }
    .eyebrow { font-size: 10px; letter-spacing: 0.2em; }
    .eyebrow .dash { display: none; }
    .eyebrow .dot { display: block; }
    h1 { font-size: clamp(44px, 16vw, 64px); line-height: 0.95; }
    h1 br { display: none; }
    .lede { font-size: 13px; }
    footer { font-size: 10px; letter-spacing: 0.18em; padding-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <img class="hero-mark" src="/mark.png" alt="" width="800" height="782">

  <header>
    <div class="brand">
      <img src="/mark.png" alt="Rampjet logo" width="28" height="27">
      <span>RAMPJET</span>
    </div>
    <div class="status"><span class="dot" aria-hidden="true"></span><span>By introduction only</span></div>
  </header>

  <main>
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span><span class="dash" aria-hidden="true">— </span>Commissioned software / Select clients</p>
    <h1>We build what<br> <span class="soft">can’t be bought</span><span class="stop">.</span></h1>
    <p class="lede">Private software, engineered for a short list of companies.</p>
  </main>

  <footer>
    <span class="d-only">© 2026 Rampjet</span>
    <span class="right d-only"><span>Built quietly</span><img class="shh" src="/shh.png" alt="" width="640" height="639"></span>
    <span class="m-only">By introduction only</span>
    <span class="m-only">© 2026</span>
  </footer>
</div>
</body>
</html>
